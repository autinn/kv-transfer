[project]
name = "kvtransfer"
version = "0.1.0"
description = "Cross-model KV cache transfer via closed-form linear mapping (arXiv 2608.03893 replication, Qwen3 0.6B -> 1.7B)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51",
    "accelerate>=0.26",   # device_map loading in runtime.load_model
    "datasets>=2.20",
    "safetensors>=0.4",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plot = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kvtransfer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requires downloading model weights"]
