# Laptop-sized smoke run of the real pair: every stage of the pipeline, with small
# counts. Checks the code on real weights; the numbers are not results.
source: Qwen/Qwen3-0.6B
target: Qwen/Qwen3-1.7B
output_dir: results/smoke_0.6b_to_1.7b

calibration:
  dataset: fineweb-edu
  n_seqs: 16
  seq_len: 512
  stride: 4
  seed: 0

runtime:
  chunk: 4
  batch_size: 1
  dtype: float16
  device: mps
  store_dir: results/kv

probe:
  gram_dtype: float32
  rope_diagonal_only: true

fit:
  lambdas: [0.01]
  k_sweep: [1, 4]
  max_gram_gb: 2

eval:
  wikitext_seqs: 8
  seq_len: 512
  prefix_len: 256
  store_budget_gb: 2
  # The two smallest benchmarks (ARC-C ~1 MB, WinoGrande ~5 MB on disk).
  tasks:
    arc_challenge: {num_fewshot: 0, limit: 50}
    winogrande: {num_fewshot: 0, limit: 50}
